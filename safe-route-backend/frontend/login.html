<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SafeRoute - Login</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: white ;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      overflow: hidden;
      max-width: 900px;
      width: 100%;
      display: flex;
      min-height: 550px;
    }

    .left-panel {
      flex: 1;
      background: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%);
      padding: 60px 40px;
      color: white;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .left-panel h1 {
      font-size: 48px;
      margin-bottom: 20px;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
    }

    .left-panel p {
      font-size: 18px;
      line-height: 1.6;
      opacity: 0.95;
    }

    .features {
      margin-top: 30px;
      text-align: left;
    }

    .feature {
      display: flex;
      align-items: center;
      margin: 15px 0;
      font-size: 16px;
    }

    .feature span {
      font-size: 24px;
      margin-right: 15px;
    }

    .right-panel {
      flex: 1;
      padding: 60px 50px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .right-panel h2 {
      color: #2c3e50;
      margin-bottom: 10px;
      font-size: 32px;
    }

    .right-panel .subtitle {
      color: #7f8c8d;
      margin-bottom: 30px;
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 25px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: #34495e;
      font-weight: 600;
      font-size: 14px;
    }

    .form-group input {
      width: 100%;
      padding: 15px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      font-size: 15px;
      transition: all 0.3s;
    }

    .form-group input:focus {
      outline: none;
      border-color: #2ecc71;
      box-shadow: 0 0 0 3px rgba(46, 204, 113, 0.1);
    }

    .password-wrapper {
      position: relative;
    }

    .toggle-password {
      position: absolute;
      right: 15px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      font-size: 20px;
      color: #7f8c8d;
    }

    .remember-forgot {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
      font-size: 14px;
    }

    .remember-forgot label {
      display: flex;
      align-items: center;
      color: #34495e;
      cursor: pointer;
    }

    .remember-forgot input[type="checkbox"] {
      margin-right: 8px;
      cursor: pointer;
    }

    .remember-forgot a {
      color: #2ecc71;
      text-decoration: none;
      font-weight: 600;
    }

    .remember-forgot a:hover {
      text-decoration: underline;
    }

    .btn {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 4px 15px rgba(46, 204, 113, 0.3);
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(46, 204, 113, 0.4);
    }

    .btn:active {
      transform: translateY(0);
    }

    .divider {
      text-align: center;
      margin: 25px 0;
      color: #7f8c8d;
      font-size: 14px;
      position: relative;
    }

    .divider::before,
    .divider::after {
      content: '';
      position: absolute;
      top: 50%;
      width: 40%;
      height: 1px;
      background: #e0e0e0;
    }

    .divider::before {
      left: 0;
    }

    .divider::after {
      right: 0;
    }

    .social-login {
      display: flex;
      gap: 15px;
    }

    .social-btn {
      flex: 1;
      padding: 12px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      background: white;
      cursor: pointer;
      transition: all 0.3s;
      font-size: 14px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .social-btn:hover {
      border-color: #2ecc71;
      background: #f8f9fa;
    }

    .signup-link {
      text-align: center;
      margin-top: 25px;
      color: #7f8c8d;
      font-size: 14px;
    }

    .signup-link a {
      color: #2ecc71;
      text-decoration: none;
      font-weight: 600;
    }

    .signup-link a:hover {
      text-decoration: underline;
    }

    @media (max-width: 768px) {
      .container {
        flex-direction: column;
      }

      .left-panel {
        padding: 40px 30px;
      }

      .left-panel h1 {
        font-size: 36px;
      }

      .right-panel {
        padding: 40px 30px;
      }

      .features {
        display: none;
      }
    }

    .error-message {
      color: #e74c3c;
      font-size: 14px;
      margin-top: 10px;
      display: none;
    }

    .success-message {
      color: #2ecc71;
      font-size: 14px;
      margin-top: 10px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="left-panel">
      <h1>🛡️ SafeRoute</h1>
      <p>Your personal safety companion for secure navigation</p>
      
      <div class="features">
        <div class="feature">
          <span>🗺️</span>
          <div>Real-time safe route planning</div>
        </div>
        <div class="feature">
          <span>🚨</span>
          <div>Emergency SOS alerts</div>
        </div>
        <div class="feature">
          <span>📍</span>
          <div>Live incident reporting</div>
        </div>
        <div class="feature">
          <span>🎤</span>
          <div>Voice-activated emergency</div>
        </div>
      </div>
    </div>

    <div class="right-panel">
      <h2>Welcome Back!</h2>
      <p class="subtitle">Please login to your account</p>

      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input 
            type="email" 
            id="email" 
            placeholder="Enter your email"
            required
          >
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="password-wrapper">
            <input 
              type="password" 
              id="password" 
              placeholder="Enter your password"
              required
            >
            <span class="toggle-password" onclick="togglePassword()"></span>
          </div>
        </div>

        <div class="remember-forgot">
          <label>
            <input type="checkbox" id="remember">
            Remember me
          </label>
          <a href="#" onclick="alert('Password reset feature coming soon!'); return false;">Forgot Password?</a>
        </div>

        <button type="submit" class="btn">Sign In</button>

        <div class="error-message" id="errorMessage"></div>
        <div class="success-message" id="successMessage"></div>
      </form>

      <div class="divider">OR</div>

      <div class="social-login">
        <button class="social-btn" onclick="socialLogin('google')">
          <span>🔍</span> Google
        </button>
        <button class="social-btn" onclick="socialLogin('facebook')">
          <span>📘</span> Facebook
        </button>
      </div>

      <div class="signup-link">
        Don't have an account? <a href="#" onclick="showSignup(); return false;">Sign Up</a>
      </div>
    </div>
  </div>

  <script>
    function togglePassword() {
      const passwordInput = document.getElementById('password');
      const toggleIcon = document.querySelector('.toggle-password');
      
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        toggleIcon.textContent = '';
      } else {
        passwordInput.type = 'password';
        toggleIcon.textContent = '';
      }
    }

    function handleLogin(event) {
      event.preventDefault();
      
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const remember = document.getElementById('remember').checked;
      
      const errorMessage = document.getElementById('errorMessage');
      const successMessage = document.getElementById('successMessage');
      
      // Hide previous messages
      errorMessage.style.display = 'none';
      successMessage.style.display = 'none';
      
      // Demo credentials
      if (email === 'demo@saferoute.com' && password === 'mayank') {
        successMessage.textContent = ' Login successful! Redirecting...';
        successMessage.style.display = 'block';
        
        // Store login state
        if (remember) {
          localStorage.setItem('saferoute_user', JSON.stringify({ email, loggedIn: true }));
        } else {
          sessionStorage.setItem('saferoute_user', JSON.stringify({ email, loggedIn: true }));
        }
        
        // Redirect to main app after 1.5 seconds
        setTimeout(() => {
          window.location.href = 'index.html';
        }, 1500);
      } else {
        errorMessage.textContent = ' Invalid email or password. Try demo@saferoute.com / mayank ';
        errorMessage.style.display = 'block';
      }
    }

    function socialLogin(provider) {
      alert(`${provider} login will be implemented with OAuth!`);
      // In production, this would redirect to OAuth provider
    }

    function showSignup() {
      alert('Sign up page coming soon! For now, use demo@saferoute.com / mayank');
    }

    // Check if already logged in
    window.onload = function() {
      const user = localStorage.getItem('saferoute_user') || sessionStorage.getItem('saferoute_user');
      if (user) {
        const userData = JSON.parse(user);
        if (userData.loggedIn) {
          window.location.href = 'index.html';
        }
      }
    };
  </script>
</body>
</html>
